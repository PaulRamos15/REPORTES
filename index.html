<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script>L_NO_TOUCH = false; L_DISABLE_3D = false;</script>
    <style>html, body {width: 100%;height: 100%;margin: 0;padding: 0;}</style>
    <style>#map {position:absolute;top:0;bottom:0;right:0;left:0;}</style>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/python-visualization/folium/folium/templates/leaflet.awesome.rotate.min.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body>
    <div class="folium-map" id="map_pro" style="width: 100%; height: 100%;"></div>
    
    <div style="position: fixed; bottom: 30px; left: 30px; width: 190px; height: auto; 
                background: white; border:2px solid #7f8c8d; z-index:9999; font-size:12px;
                border-radius:10px; padding:12px; font-family:Arial, sans-serif; box-shadow: 3px 3px 6px rgba(0,0,0,0.3);">
        <b style="font-size:13px; color:#2c3e50;">Elevación (Jenks)</b><br><    <div style="margin-top:6px;">
            <i style="background:#2A9D8F; border-radius:50%; width:11px; height:11px; display:inline-block; border:1px solid #000;"></i> Piso 1 (Bajo)<br>
            <i style="background:#F4A261; border-radius:50%; width:11px; height:11px; display:inline-block; border:1px solid #000;"></i> Piso 3 (Medio)<br>
            <i style="background:#D62828; border-radius:50%; width:11px; height:11px; display:inline-block; border:1px solid #000;"></i> Piso 5 (Alto)<br>
            <i style="background:#7209B7; border-radius:50%; width:11px; height:11px; display:inline-block; border:1px solid #000;"></i> Piso 7 (Puna)<br>
            <i style="background:#B5179E; border-radius:50%; width:11px; height:11px; display:inline-block; border:1px solid #000;"></i> Piso 8 (Extremo)<br>
        </div>
        <hr style="margin:8px 0;">
        <small style="color:#7f8c8d; display:block;">Filtra las regiones usando el control superior derecho.</small>
    </div>
</body>
<script>
    // 1. INICIALIZAR MAPA BASE (CartoDB Positron)
    var map_pro = L.map("map_pro", {center: [-9.19, -75.015], zoom: 6, crs: L.CRS.EPSG3857});
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CartoDB"
    }).addTo(map_pro);

    // 2. CREAR CAPAS INDEPENDIENTES para el botón de clasificación
    var capa_costa = L.layerGroup().addTo(map_pro);
    var capa_sierra = L.layerGroup().addTo(map_pro);
    var capa_selva = L.layerGroup().addTo(map_pro);

    // 3. DATOS DE PARCELAS REPRESENTATIVAS (Muestra Estricta)
    var puntos_papa = [
        {lat: -15.84, lon: -70.02, lugar: "Puno, Puno", alt: 3812, var: "PAPA NATIVA", piso: "Piso 7", color: "#7209B7", reg: "SIERRA"},
        {lat: -14.90, lon: -70.25, lugar: "Azángaro, Puno", alt: 3850, var: "PAPA AMARGA", piso: "Piso 8", color: "#B5179E", reg: "SIERRA"},
        {lat: -16.20, lon: -69.45, lugar: "Chucuito, Puno", alt: 3825, var: "PAPA COLOR", piso: "Piso 7", color: "#7209B7", reg: "SIERRA"},
        {lat: -11.15, lon: -75.99, lugar: "Junín, Junín", alt: 4105, var: "PAPA HUAYRO", piso: "Piso 8", color: "#B5179E", reg: "SIERRA"},
        {lat: -13.65, lon: -73.39, lugar: "Andahuaylas, Apurímac", alt: 2926, var: "PAPA AMARILLA", piso: "Piso 3", color: "#F4A261", reg: "SIERRA"},
        {lat: -9.93, lon: -76.24, lugar: "Huánuco, Huánuco", alt: 1894, var: "PAPA BLANCA", piso: "Piso 1", color: "#2A9D8F", reg: "SIERRA"},
        {lat: -4.18, lon: -76.45, lugar: "Datem del Marañón, Loreto", alt: 126, var: "PAPA NATIVA (Dato ENA)", piso: "Piso 1", color: "#2A9D8F", reg: "SELVA"},
        {lat: -12.04, lon: -77.03, lugar: "Lima, Lima", alt: 150, var: "PAPA JAPONESA", piso: "Piso 1", color: "#2A9D8F", reg: "COSTA"}
    ];

    // 4. INYECTAR PUNTOS EN SUS RESPECTIVAS CAPAS
    puntos_papa.forEach(function(p) {
        var contenido_popup = `
            <div style='font-family:Arial; width:180px; font-size:12px;'>
                <h4 style='margin:0 0 5px 0; font-size:14px; color:#2c3e50;'><b>${p.var}</b></h4>
                <hr style='margin:4px 0;'>
                <b>Lugar:</b> ${p.lugar}<br>
                <b>Altitud:</b> ${p.alt} msnm<br>
                <b>Región Natural:</b> ${p.reg}<br>
                <b>Clasificación:</b> <span style='color:${p.color}; font-weight:bold;'>${p.piso}</span>
            </div>`;

        var marcador = L.circleMarker([p.lat, p.lon], {
            radius: 6,
            color: '#fff',
            weight: 1,
            fillColor: p.color,
            fillOpacity: 0.9
        }).bindPopup(contenido_popup);

        if(p.reg === "COSTA") marcador.addTo(capa_costa);
        if(p.reg === "SIERRA") marcador.addTo(capa_sierra);
        if(p.reg === "SELVA") marcador.addTo(capa_selva);
    });

    // 5. CONTROL DE CLASIFICACIÓN INTERACTIVO (Arriba a la derecha)
    var capas_regiones = {
        "🏝️ Costa (Baja Altitud)": capa_costa,
        "⛰️ Sierra (Andes)": capa_sierra,
        "🌳 Selva (Amazonía)": capa_selva
    };
    L.control.layers(null, capas_regiones, {collapsed: false, position: 'topright'}).addTo(map_pro);
</script>
</html>
