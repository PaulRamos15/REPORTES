<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carátula - Análisis de Papa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3c6e, #2c5aa0);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        .cover {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.4rem;
            margin-bottom: 40px;
            opacity: 0.95;
        }
        
        .info {
            margin-top: 50px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .highlight {
            background: linear-gradient(90deg, #f4a261, #e76f51);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }
        
        .footer {
            margin-top: 60px;
            font-size: 0.95rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="cover">
        <h1 class="title">
            Análisis Espacial del Cultivo de Papa<br>
            en el Perú
        </h1>
        
        <h2 class="subtitle">
            Clasificación por <span class="highlight">Pisos Altitudinales (Jenks)</span><br>
            y Regiones Naturales
        </h2>

        <div class="info">
            <p><strong>Fuente de datos:</strong> Encuesta Nacional Agraria (ENA) 2014–2024</p>
            <p><strong>Metodología:</strong> Jenks Natural Breaks + Análisis Geoespacial</p>
        </div>

        <div class="footer">
            <p>Análisis realizado con Python + Folium + Jenks</p>
        </div>
    </div>

</body>
</html>
